name: Build & Publish Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Assemble Antigravity Hub APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses & install Android 36.1
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Prepare environment & debug signing keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          [ -f .env ] || cp .env.example .env
          if [ -n "$GOOGLE_SERVICES_JSON" ] && [ ! -f app/google-services.json ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
          if [ ! -f app/google-services.json ]; then
            echo "::warning::app/google-services.json not found; building with googleServices.missing.passthrough=true."
          fi
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:" || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --console=plain -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" -Dorg.gradle.workers.max=2

      - name: Prepare APK filename
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AntigravityHub-latest.apk
          ls -lh AntigravityHub-latest.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityHub-APK
          path: AntigravityHub-latest.apk

      - name: Publish APK to GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Antigravity Hub (Latest APK)
          make_latest: true
          files: |
            AntigravityHub-latest.apk
